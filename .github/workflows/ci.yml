name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-4-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed release v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed release v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # reviewed release v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Formatting and linting
        run: make lint
      - name: Strict type checking
        run: make typecheck
      - name: Contract, storage, structural, worker, report, security, and API tests
        run: make test
      - name: Validate generated contracts
        run: make schemas && git diff --exit-code -- schemas
      - name: Generate OpenAPI
        run: make openapi
      - name: Structural and report smoke tests
        run: make structural-smoke && make report-smoke
      - name: Validate Community Forensics worker manifest and mock handler
        run: make image-community-manifest-check && make image-community-mock
      - name: Validate Community Forensics Docker assets and notices
        run: make image-community-docker-lint
      - name: Repository safety scan
        run: make safety
