[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimedia-forensic-platform"
version = "0.1.0"
description = "Evidence-first multimedia forensic analysis platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.1,<3",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]
image-community-gpu = [
  "huggingface-hub==0.34.4",
  "runpod==1.7.13",
  "safetensors==0.6.2",
  "timm==1.0.15",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[dependency-groups]
image-community-mock-runtime = [
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
]
image-community-runtime = [
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "huggingface-hub==0.34.4",
  "numpy>=2.1,<3",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "runpod==1.7.13",
  "safetensors==0.6.2",
  "timm==1.0.15",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[tool.setuptools.packages.find]
where = [
  "packages/contracts/src",
  "packages/evidence/src",
  "packages/structural/src",
  "apps/api/src",
  "workers/image-community/src",
]

[tool.setuptools.package-data]
forensic_structural = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "gpu: explicitly opted-in tests requiring an NVIDIA CUDA device",
  "integration: tests requiring external runtime resources",
  "tool_integration: optional tests that require a locally installed metadata tool",
]
testpaths = [
  "packages/contracts/tests",
  "packages/evidence/tests",
  "packages/structural/tests",
  "apps/api/tests",
  "workers/image-community/tests",
]
pythonpath = [
  ".",
  "packages/contracts/src",
  "packages/evidence/src",
  "packages/structural/src",
  "apps/api/src",
  "workers/image-community/src",
  "workers/image-community/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["private_cases", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["private_cases", "var"]
plugins = ["pydantic.mypy"]
mypy_path = ".:packages/contracts/src:packages/evidence/src:packages/structural/src:apps/api/src:workers/image-community/src:workers/image-community/tests"
