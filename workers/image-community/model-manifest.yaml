output:
  raw_output_type: binary_classification_logit
  tensor_shape: [batch, 1]
  class_mapping:
    "0": real
    "1": fake
  positive_class: fake
  score_semantics: >-
    One pre-sigmoid binary-classification logit. The upstream evaluation uses
    real=0 and fake=1 and applies sigmoid for benchmark metrics, but publishes
    no calibration establishing a probability or forensic certainty meaning.
  probability: false
  calibrated: false

limitations:
  - The raw logit is uncalibrated and is supporting evidence, not a verdict.
  - Benchmark performance does not establish production performance.
  - Python minimum support is not declared by upstream; the worker selects Python 3.11.
  - CUDA minimum support is not declared by upstream; the worker selects the pinned CUDA 12.6.3 base.
  - GPU and checkpoint parity remain untested until an explicitly authorized cloud run.
