[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-image-community-worker"
version = "0.1.0"
description = "Community Forensics Phase 4 GPU-worker adapter"
requires-python = ">=3.11"
dependencies = [
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
gpu = [
  "huggingface-hub==0.34.4",
  "runpod==1.7.13",
  "safetensors==0.6.2",
  "timm==1.0.15",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[tool.setuptools.packages.find]
where = ["src"]
